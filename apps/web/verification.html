<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tevion frontend interaction verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace" style="display:block;max-width:720px;padding:40px">
    <section class="panel" style="padding:32px">
      <div class="eyebrow">INTERACTION VERIFICATION</div>
      <h1>验证历史面板契约</h1>
      <p class="muted">这个页面用于检查工作台入口、历史面板容器和真实 API 调用契约。</p>
      <div id="checks" class="memory-block"></div>
      <button class="primary-button" id="run-checks">运行验证</button>
    </section>
  </main>
  <div hidden>
    <button id="generate"></button><button id="loginBtn"></button><button id="logoutBtn"></button>
    <button id="memoryBtn"></button><button id="profileBtn"></button>
    <div id="authChip"></div><p id="loginHint"></p><div id="results"></div>
    <div id="historyPanel"><p id="historyStatus"></p><select id="historyProject"></select><select id="historySession"></select><div id="historyVersions"></div></div>
  </div>
  <script src="app.js"></script>
  <script>
    const checks = [];
    const record = (name, ok) => checks.push({name, ok});
    const renderChecks = () => {
      document.getElementById('checks').innerHTML = checks.map(c => `<p>${c.ok ? '✓' : '✗'} ${c.name}</p>`).join('');
    };
    document.getElementById('run-checks').addEventListener('click', async () => {
      checks.length = 0;
      const historyIds = ['historyPanel', 'historyStatus', 'historyProject', 'historySession', 'historyVersions'];
      record('项目历史面板 DOM 完整', historyIds.every(id => Boolean(document.getElementById(id))));
      record('项目与会话选择控件属于历史面板',
        document.getElementById('historyProject')?.closest('#historyPanel') === document.getElementById('historyPanel') &&
        document.getElementById('historySession')?.closest('#historyPanel') === document.getElementById('historyPanel'));
      try {
        const source = await fetch('app.js').then(response => {
          if (!response.ok) throw new Error('app.js HTTP ' + response.status);
          return response.text();
        });
        const has = pattern => pattern.test(source);
        record('token helpers 使用 sessionStorage',
          has(/function getToken\(\)\s*\{[^}]*sessionStorage\.getItem\(TOKEN_KEY\)/s) &&
          has(/function setToken\(t\)\s*\{[^}]*sessionStorage\.setItem\(TOKEN_KEY,\s*t\)/s) &&
          has(/function clearToken\(\)\s*\{[^}]*sessionStorage\.removeItem\(TOKEN_KEY\)/s) &&
          !has(/localStorage\.(getItem|setItem|removeItem)\(TOKEN_KEY/));
        record('历史查询包含三个真实 endpoint',
          has(/api\(\s*['"]\/projects['"]\s*\)/) &&
          has(/api\(\s*['"]\/projects\/['"]\s*\+\s*encodeURIComponent\(projectId\)\s*\+\s*['"]\/sessions['"]\s*\)/) &&
          has(/api\(\s*['"]\/sessions\/['"]\s*\+\s*encodeURIComponent\(sessionId\)\s*\+\s*['"]\/versions['"]\s*\)/));
        const projectCall = source.indexOf("api('/projects')");
        const sessionCall = source.indexOf("api('/projects/' + encodeURIComponent(projectId) + '/sessions')");
        const versionCall = source.indexOf("api('/sessions/' + encodeURIComponent(sessionId) + '/versions')");
        const projectToSession = source.indexOf('await loadHistorySessions(historyProjects[0].id)');
        const sessionToVersion = source.indexOf('await loadHistoryVersions(historySessions[0].id)');
        record('历史查询按项目→会话→版本顺序串联',
          projectCall >= 0 && sessionCall >= 0 && versionCall >= 0 &&
          /function loadProjectHistory\(\)[\s\S]*await loadHistorySessions\(historyProjects\[0\]\.id\)/.test(source) &&
          /function loadHistorySessions\(projectId\)[\s\S]*await loadHistoryVersions\(historySessions\[0\]\.id\)/.test(source));
        record('历史查询使用统一 token helper', has(/function loadProjectHistory\(\)[\s\S]*getToken\(\)/));
        record('历史版本展示 parent_image_id lineage', has(/version\.parent_image_id/) && has(/history-parent/));
        record('历史接口失败提供可恢复提示',
          has(/历史版本读取失败：[\s\S]*可重新选择会话重试/) &&
          has(/会话读取失败：[\s\S]*可重新选择项目重试/) &&
          has(/项目历史读取失败：[\s\S]*后端接口就绪后可重试/));
      } catch (error) {
        record('可读取 app.js focused 契约', false);
      }
      renderChecks();
    });
  </script>
</body>
</html>
