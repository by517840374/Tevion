<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tevion frontend interaction verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace" style="display:block;max-width:720px;padding:40px">
    <section class="panel" style="padding:32px">
      <div class="eyebrow">INTERACTION VERIFICATION</div>
      <h1>验证历史面板契约</h1>
      <p class="muted">这个页面用于检查工作台入口、历史面板容器和真实 API 调用契约。</p>
      <div id="checks" class="memory-block"></div>
      <button class="primary-button" id="run-checks">运行验证</button>
    </section>
  </main>
  <div hidden>
    <button id="generate"></button><button id="loginBtn"></button><button id="logoutBtn"></button>
    <button id="memoryBtn"></button><button id="profileBtn"></button>
    <div id="authChip"></div><p id="loginHint"></p><div id="results"></div>
    <div id="historyPanel"><p id="historyStatus"></p><select id="historyProject"></select><select id="historySession"></select><div id="historyVersions"></div></div>
  </div>
  <script src="app.js"></script>
  <script>
    const checks = [];
    const record = (name, ok) => checks.push({name, ok});
    const renderChecks = () => {
      document.getElementById('checks').innerHTML = checks.map(c => `<p>${c.ok ? '✓' : '✗'} ${c.name}</p>`).join('');
    };
    document.getElementById('run-checks').addEventListener('click', async () => {
      checks.length = 0;
      record('历史面板容器存在', Boolean(document.getElementById('historyPanel')) && Boolean(document.getElementById('historyProject')) && Boolean(document.getElementById('historySession')) && Boolean(document.getElementById('historyVersions')));
      try {
        const source = await fetch('app.js').then(response => response.text());
        record('history token 使用 sessionStorage', source.includes('sessionStorage.getItem(TOKEN_KEY)') && source.includes('sessionStorage.setItem(TOKEN_KEY, token)') && source.includes('sessionStorage.removeItem(TOKEN_KEY)') && !source.includes('localStorage.getItem(TOKEN_KEY)'));
        record('401 清理调用统一 clearToken', /if \(res\.status === 401\) clearToken\(\);/.test(source));
        record('OIDC callback 使用相同 setToken helper', /setToken\(data\.access_token\);/.test(source));
        const exchange = source.indexOf('fetch(OIDC_CONFIG.token_endpoint');
        const consume = source.indexOf('sessionStorage.removeItem(OIDC_TRANSACTION_KEY)');
        record('token exchange 前保留 transaction', exchange >= 0 && consume > exchange);
        record('成功消费 transaction', source.indexOf('setToken(data.access_token)') < consume);
        record('失败/取消清理 callback URL', source.includes('} finally {') && source.includes('sanitizeOidcCallbackUrl();'));
        record('清理 code/state/error 且不泄露敏感值', ['code', 'state', 'error'].every(key => source.includes("url.searchParams.delete('" + key + "')")) && !source.includes('console.log(code)'));
        record('历史查询使用 project→session→version API 链', source.includes("async function loadProjectHistory()") && source.includes("api('/projects')") && source.includes("async function loadHistorySessions(projectId)") && source.includes("api('/projects/' + encodeURIComponent(projectId) + '/sessions')") && source.includes("async function loadHistoryVersions(sessionId)") && source.includes("api('/sessions/' + encodeURIComponent(sessionId) + '/versions')") && source.includes('getToken()'));
        record('历史查询按项目→会话→版本顺序串联', source.indexOf("loadProjectHistory()") < source.indexOf("loadHistorySessions(projectId)") && source.indexOf("loadHistorySessions(projectId)") < source.indexOf("loadHistoryVersions(sessionId)") && source.indexOf("api('/projects')") < source.indexOf("api('/projects/' + encodeURIComponent(projectId) + '/sessions')") && source.indexOf("api('/projects/' + encodeURIComponent(projectId) + '/sessions')") < source.indexOf("api('/sessions/' + encodeURIComponent(sessionId) + '/versions')"));
        record('历史版本展示 parent_image_id lineage', source.includes('parent_image_id') && source.includes('history-parent'));
        record('历史接口失败提供可恢复提示', source.includes('后端接口就绪后可重试') && source.includes('可重新选择会话重试'));
      } catch {
        record('history focused checks 可读取 app.js', false);
      }
      renderChecks();
    });
  </script>
</body>
</html>
