<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tevion frontend interaction verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace" style="display:block;max-width:720px;padding:40px">
    <section class="panel" style="padding:32px">
      <div class="eyebrow">INTERACTION VERIFICATION</div>
      <h1>验证 Explore → Select → Refine 契约</h1>
      <p class="muted">这个页面用于检查前端状态提示、selected parent、Refine 范围和真实 API 调用契约。</p>
      <div id="checks" class="memory-block"></div>
      <button class="primary-button" id="run-checks">运行验证</button>
    </section>
  </main>
  <div hidden>
    <button id="generate"></button><button id="loginBtn"></button><button id="logoutBtn"></button>
    <button id="memoryBtn"></button><button id="profileBtn"></button>
    <div id="memoryStatus"></div><div id="memoryList"></div>
    <div id="authChip"></div><p id="loginHint"></p><select id="ratio"><option>4:5</option><option>1:1</option><option>9:16</option><option>3:4</option><option>2:3</option><option>3:2</option><option>16:9</option><option>21:9</option><option>5:4</option><option>4:3</option><option>2:1</option><option>1:2</option><option>1:3</option></select><p id="ratioHint">尺寸</p><div id="results"></div>
    <div id="historyPanel"><p id="historyStatus"></p><select id="historyProject" class="history-select"></select><select id="historySession" class="history-select"></select><div id="historyVersions"></div></div>
    <section id="metricsSummary"><p id="metricsStatus"></p><div id="metricsGrid"></div></section>
  </div>
  <script src="app.js"></script>
  <script>
    const checks = [];
    const record = (name, ok) => checks.push({name, ok});
    const renderChecks = () => {
      document.getElementById('checks').innerHTML = checks.map(c => `<p>${c.ok ? '✓' : '✗'} ${c.name}</p>`).join('');
    };
    document.getElementById('run-checks').addEventListener('click', async () => {
      checks.length = 0;
      const historyIds = ['historyPanel', 'historyStatus', 'historyProject', 'historySession', 'historyVersions'];
      record('项目历史面板 DOM 完整', historyIds.every(id => Boolean(document.getElementById(id))));
      record('项目与会话选择控件属于历史面板',
        document.getElementById('historyProject')?.closest('#historyPanel') === document.getElementById('historyPanel') &&
        document.getElementById('historySession')?.closest('#historyPanel') === document.getElementById('historyPanel'));
      record('metrics summary DOM 完整',
        ['metricsSummary', 'metricsStatus', 'metricsGrid'].every(id => Boolean(document.getElementById(id))));
      try {
        const source = await fetch('app.js?issue105=' + Date.now()).then(response => {
          if (!response.ok) throw new Error('app.js HTTP ' + response.status);
          return response.text();
        });
        const has = pattern => pattern.test(source);
        record('token helpers 使用 sessionStorage',
          has(/function getToken\(\)\s*\{[^}]*sessionStorage\.getItem\(TOKEN_KEY\)/s) &&
          has(/function setToken\(t\)\s*\{[^}]*sessionStorage\.setItem\(TOKEN_KEY,\s*t\)/s) &&
          has(/function clearToken\(\)\s*\{[^}]*sessionStorage\.removeItem\(TOKEN_KEY\)/s) &&
          !has(/localStorage\.(getItem|setItem|removeItem)\(TOKEN_KEY/));
        record('历史查询包含三个真实 endpoint',
          has(/api\(\s*['"]\/projects['"]\s*\)/) &&
          has(/api\(\s*['"]\/projects\/['"]\s*\+\s*encodeURIComponent\(projectId\)\s*\+\s*['"]\/sessions['"]\s*\)/) &&
          has(/api\(\s*['"]\/sessions\/['"]\s*\+\s*encodeURIComponent\(sessionId\)\s*\+\s*['"]\/versions['"]\s*\)/));
        const projectCall = source.indexOf("api('/projects')");
        const sessionCall = source.indexOf("api('/projects/' + encodeURIComponent(projectId) + '/sessions')");
        const versionCall = source.indexOf("api('/sessions/' + encodeURIComponent(sessionId) + '/versions')");
        const projectToSession = source.indexOf('await loadHistorySessions(historyProjects[0].id)');
        const sessionToVersion = source.indexOf('await loadHistoryVersions(historySessions[0].id)');
        record('历史查询按项目→会话→版本顺序串联',
          projectCall >= 0 && sessionCall >= 0 && versionCall >= 0 &&
          /function loadProjectHistory\(\)[\s\S]*await loadHistorySessions\(historyProjects\[0\]\.id\)/.test(source) &&
          /function loadHistorySessions\(projectId\)[\s\S]*await loadHistoryVersions\(historySessions\[0\]\.id\)/.test(source));
        record('历史查询使用统一 token helper', has(/function loadProjectHistory\(\)[\s\S]*getToken\(\)/));
        record('metrics 使用真实 GET endpoint 与 token helper',
          has(/function loadMetrics\(\)/) && has(/api\(['"]\/metrics['"]\)/) &&
          has(/function loadMetrics\(\)[\s\S]*getToken\(\)/));
        record('metrics 覆盖 loading、empty、error、401 与核心指标展示',
          has(/正在加载产品指标/) && has(/暂无可用产品指标/) && has(/产品指标读取失败/) &&
          has(/401/) && has(/generation_completion_rate/) && has(/candidate_selection_rate/) &&
          has(/feedback_completion_rate/) && has(/explore_to_refine_rate/) &&
          has(/average_generation_rounds/) && has(/latency_ms/) && has(/cost/));
        record('登录态刷新时加载 metrics', has(/function refreshLoginUI\(\)[\s\S]*loadMetrics\(\)/));
        record('历史版本展示 parent_image_id lineage', has(/version\.parent_image_id/) && has(/history-parent/));
        record('历史接口失败提供可恢复提示',
          has(/历史版本读取失败：[\s\S]*可重新选择会话重试/) &&
          has(/会话读取失败：[\s\S]*可重新选择项目重试/) &&
          has(/项目历史读取失败：[\s\S]*后端接口就绪后可重试/));
        record('工作台状态与候选操作具备可访问性契约',
          has(/aria-live/) && has(/aria-busy/) &&
          has(/aria-label=.*选择候选/) && has(/aria-label=.*拒绝候选/));
        record('历史面板失败状态提供显式重试入口', has(/historyRetry/) && has(/loadProjectHistory\(\)/));
        record('选择候选后明确渲染 selected parent',
          has(/function renderSelectedParent\(\)/) && has(/id = 'selectedParent'/) && has(/selected parent/));
        record('Visual Memory 面板具备可解释字段与编辑控件',
          document.getElementById('memoryList') && document.getElementById('memoryStatus') &&
          has(/scope/) && has(/source/) && has(/confidence/) && has(/evidence_count/) &&
          has(/evidence_ids/) && has(/status/) && has(/memoryList/) &&
          has(/data-edit/) && has(/data-disable/) && has(/data-delete/));
        record('Visual Memory 使用真实读写 API 契约',
          has(/\/preferences\?scope=project&task_id=/) &&
          has(/\/preferences\/\$\{encodeURIComponent\(id\)\}/) &&
          has(/method = action === 'delete'/) && has(/'PATCH'/) && has(/'POST'/) && has(/'DELETE'/) &&
          has(/\/disable/));
        record('Visual Memory 提供加载、权限、错误与 stale readback 状态',
          has(/正在加载视觉记忆/) && has(/无权限/) && has(/记忆读取失败/) && has(/stale/) &&
          has(/refreshVisualMemory/));
        record('切换 Refine 显示 parent 与保留项/修改项',
          has(/function renderRefineContext\(\)/) && has(/refineContext/) && has(/refineParentStatus/) &&
          has(/保留/) && has(/修改/) && has(/parent_version_id/));
        record('Refine 创建任务保留 parent_version_id API body 契约',
          has(/mode: currentTask\.mode/) && has(/parent_version_id: currentTask\.parent_version_id/) &&
          has(/api\(['"]\/tasks['"]/));
        record('ratio 提供 13 种选项与尺寸说明',
          document.querySelectorAll('#ratio option').length === 13 &&
          document.getElementById('ratioHint')?.textContent.includes('尺寸'));
        record('候选图片具备 lightbox 触发与键盘可访问性',
          has(/function openLightbox\(/) && has(/data-lightbox/) && has(/type="button"/) &&
          has(/aria-label=.*大图预览/) && has(/\.focus\(\)/));
        record('项目历史 select 使用 Tevion 视觉统一类',
          document.getElementById('historyProject')?.classList.contains('history-select') &&
          document.getElementById('historySession')?.classList.contains('history-select'));
        record('结果展示 requested actual 数量与短缺解释',
          has(/requested_output_count/) && has(/actual_output_count/) && has(/output_completeness/) &&
          has(/output_shortfall/) && has(/请求.*实际|实际.*请求/));
      } catch (error) {
        record('可读取 app.js focused 契约', false);
      }
      renderChecks();
    });
  </script>
</body>
</html>
